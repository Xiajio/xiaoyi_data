<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>小亿数据 · 宿主接入演示</title>
<style>
:root{font-family:Inter,"Segoe UI","Microsoft YaHei",sans-serif;color:#292622;background:#f5f3ee;font-synthesis:none}*{box-sizing:border-box}body{margin:0}button,select{font:inherit}button,select{min-height:36px;border:1px solid #d6d0c5;border-radius:7px;background:#fff;color:inherit;padding:7px 11px}button{cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}button:hover{border-color:#a83223}button:focus-visible,select:focus-visible{outline:3px solid #b95645;outline-offset:2px}button.primary{background:#a83223;color:#fff;border-color:#a83223}.header{padding:20px 28px 15px;border-bottom:1px solid #ded8cf;background:#fcfbf7;display:flex;gap:22px;align-items:center}.brand{font-weight:750;font-size:20px;white-space:nowrap}.badge{font-size:11px;letter-spacing:.1em;color:#9b3d2a;margin-bottom:7px}.subtitle{font-size:13px;color:#777166;margin-top:5px}.header p{margin:0;font-size:12px;max-width:430px;line-height:1.7;color:#777166}.controls{padding:14px 28px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}.controls label{font-size:12px;color:#777166;display:flex;align-items:center;gap:7px}.divider{height:24px;width:1px;background:#d9d2c6;margin:0 3px}.status{margin-left:auto;font-size:12px;color:#6a655c}.layout{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:14px;padding:0 18px 18px;min-height:calc(100dvh - 170px)}.frame{border:1px solid #d6d0c5;background:#fff;border-radius:10px;overflow:hidden;min-height:650px;position:relative}.frame iframe{display:block;width:100%;height:100%;min-height:650px;border:0}.empty{padding:70px 25px;text-align:center;color:#7e7569;line-height:2}.side{border:1px solid #d6d0c5;background:#fcfbf7;border-radius:10px;padding:18px;overflow:auto;max-height:calc(100dvh - 170px)}h1{font-size:16px;margin:0 0 9px}h2{font-size:12px;letter-spacing:.1em;color:#796d5d;margin:23px 0 8px}.side p{font-size:12px;color:#82786a;line-height:1.75}.meta{font-size:11px;line-height:1.8;word-break:break-all;background:#f0ece4;padding:10px;border-radius:5px}.event{font-size:11px;padding:10px 0;border-top:1px solid #e7e1d7;line-height:1.7;word-break:break-word}.event time{color:#998e7c}.event b{display:block;font-size:12px}.event pre{white-space:pre-wrap;margin:5px 0 0;font:11px/1.6 Consolas,monospace;max-height:190px;overflow:auto}#export-output{width:100%;min-height:130px;resize:vertical;font:11px/1.6 Consolas,monospace;color:#51483b;background:#fff;border:1px solid #d9d2c6;border-radius:5px;padding:8px}#clear-log{font-size:11px;min-height:28px;padding:3px 8px}.side-head{display:flex;justify-content:space-between;align-items:center}@media(max-width:1050px){.layout{grid-template-columns:minmax(0,1fr)}.side{max-height:380px}.frame iframe{min-height:760px}.header{align-items:flex-start}.header p{display:none}.status{width:100%;margin-left:0}}@media(max-width:600px){.header,.controls{padding-left:14px;padding-right:14px}.layout{padding:0 8px 8px}.divider{display:none}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
</head>
<body>
<header class="header"><div><div class="badge">XIAOYI / EMBEDDING LAB</div><div class="brand">数据处理工作台 · 宿主示例</div><div class="subtitle">独立页面装载，可验证的主题、会话与导航交互</div></div><p>此页模拟宿主容器。内部数据均为合成案例；导出结果只供演示，工具不会接入真实业务系统。</p></header>
<nav class="controls" aria-label="宿主控制">
<button id="toggle" class="primary">关闭工具</button><button id="reopen">重开 iframe</button><span class="divider"></span>
<label>主题<select id="theme"><option value="light">浅色</option><option value="dark">深色</option></select></label>
<label>定位<select id="page"><option value="overview">工作概览</option><option value="intake">数据接入</option><option value="processing">数据处理</option><option value="review">核验工作台</option><option value="cases">对象资料库</option><option value="publish">数据集与发布</option><option value="audit">运行与审计</option></select></label>
<button id="navigate">打开页面</button><button id="field">定位字段 R-01</button><span class="divider"></span><button id="session">切换新会话</button><button id="previous-session">返回上一会话</button><button id="reset">重置演示</button><span id="status" class="status" role="status">正在连接…</span>
</nav>
<main class="layout"><section class="frame" id="frame-slot" aria-label="数据工具容器"></section><aside class="side"><div class="side-head"><h1>桥接事件</h1><button id="clear-log">清空</button></div><p>关闭再打开会产生新的实例 ID。宿主切换会话时，旧会话指令不再生效。</p><div id="connection" class="meta">等待工具就绪</div><h2>最近一次导出</h2><p>在工具内完成核验、冻结与审批，再点击导出；宿主在这里接收事件。</p><textarea id="export-output" readonly aria-label="最近一次导出事件" placeholder="尚未收到导出事件"></textarea><button id="download-export" disabled style="margin-top:8px;width:100%">下载演示 JSON</button><h2>事件记录</h2><div id="events" aria-live="polite"></div></aside></main>
<script type="module" src="/examples/host.ts"></script>
</body></html>
