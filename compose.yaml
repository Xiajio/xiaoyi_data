services:
  database:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: catalog
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: catalog
    volumes: [catalog-db:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U catalog"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: {context: ., dockerfile: deploy/Dockerfile.api}
    environment: &catalog-env
      XIAOYI_CATALOG_DB: postgresql+psycopg://catalog:${POSTGRES_PASSWORD}@database:5432/catalog
      XIAOYI_STORAGE_ROOT: /data/assets
      XIAOYI_IMPORT_ROOT: /data/import
      XIAOYI_STORAGE_QUOTA_BYTES: ${XIAOYI_STORAGE_QUOTA_BYTES:-107374182400}
      XIAOYI_DOWNLOAD_MAX_BYTES: ${XIAOYI_DOWNLOAD_MAX_BYTES:-10737418240}
      XIAOYI_CATALOG_CORS: ${XIAOYI_CATALOG_CORS:-http://localhost:8080}
      XIAOYI_SECURE_COOKIE: ${XIAOYI_SECURE_COOKIE:-0}
      XIAOYI_CATALOG_EMBED: "0"
      HF_ENDPOINT: ${HF_ENDPOINT:-https://huggingface.co}
      HF_TOKEN: ${HF_TOKEN:-}
      XIAOYI_LLM_BASE_URL: ${XIAOYI_LLM_BASE_URL:-}
      XIAOYI_LLM_MODEL: ${XIAOYI_LLM_MODEL:-}
      XIAOYI_LLM_API_KEY: ${XIAOYI_LLM_API_KEY:-}
    volumes: [catalog-assets:/data/assets, "./data/import:/data/import:ro"]
    depends_on:
      database: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:5280/api/health')"]
      interval: 10s
      retries: 10
  worker:
    build: {context: ., dockerfile: deploy/Dockerfile.api}
    command: [python, -m, xiaoyi_catalog.worker]
    environment: *catalog-env
    volumes: [catalog-assets:/data/assets, "./data/import:/data/import:ro"]
    depends_on:
      api: {condition: service_healthy}
  web:
    build: {context: ., dockerfile: deploy/Dockerfile.web}
    ports: ["127.0.0.1:8080:80"]
    depends_on:
      api: {condition: service_healthy}
volumes:
  catalog-db:
  catalog-assets:
