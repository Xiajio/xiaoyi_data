[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xiaoyi-catalog"
version = "0.5.0"
description = "小亿科研数据集平台：版本证据、受限智能体、人工审批与可复现研究包"
requires-python = ">=3.12"
dependencies = [
  "sqlalchemy>=2.0",
  "huggingface_hub>=0.26",
  "pyyaml>=6.0",
  "numpy>=1.26",
  "mcp>=1.0,<2",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "alembic>=1.14,<2",
  "psycopg[binary,pool]>=3.2,<4",
  "pgvector>=0.3,<1",
  "pydantic>=2.10,<3",
  "httpx>=0.27,<1",
  "langgraph>=1.0,<2",
  "langgraph-checkpoint-sqlite>=2,<4",
  "langgraph-checkpoint-postgres>=2,<4",
  "pillow>=11,<13",
  "pyarrow>=18,<24",
  "trimesh>=4.6,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]
embed = ["sentence-transformers>=3.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
