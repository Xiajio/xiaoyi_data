name: Verify research catalog
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: catalog
          POSTGRES_PASSWORD: catalog-test-only
          POSTGRES_DB: catalog
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U catalog"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e "./platform[dev]"
      - run: python -m pytest platform/tests -q
      - run: python -m pytest platform/tests/test_postgres.py -q
        env:
          XIAOYI_TEST_POSTGRES: postgresql+psycopg://catalog:catalog-test-only@localhost:5432/catalog
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: research-verification
          path: |
            dist/
            playwright-report/
          retention-days: 7
