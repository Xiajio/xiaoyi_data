name: Verify research catalog
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16@sha256:7b822b0aac60967beb1ea5e576b8602c94c300a157d187f385ae3e0da199b90a
        env:
          POSTGRES_USER: catalog
          POSTGRES_PASSWORD: catalog-test-only
          POSTGRES_DB: catalog
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U catalog"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check maintenance script
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          bash -n deploy/backup-maintenance.sh
          shellcheck deploy/backup-maintenance.sh
      - run: python -m pip install --require-hashes -r platform/requirements.lock
      - run: python -m pip install --no-deps --no-build-isolation -e ./platform
      - run: python -m pytest platform/tests -q
      - name: Real PostgreSQL and SQLite-to-PostgreSQL migration
        run: python -m pytest platform/tests/test_postgres.py platform/tests/test_operations.py -q
        env:
          XIAOYI_TEST_POSTGRES: postgresql+psycopg://catalog:catalog-test-only@localhost:5432/catalog
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: research-verification
          path: |
            dist/
            playwright-report/
          retention-days: 7

  compose-and-recovery:
    runs-on: ubuntu-latest
    needs: check
    env:
      POSTGRES_PASSWORD: ci-disposable-only
      XIAOYI_RELEASE: ${{ github.sha }}
      COMPOSE_FILE: compose.yaml:deploy/compose.offline.yaml
    steps:
      - uses: actions/checkout@v4
      - name: Prepare disposable volume mounts
        run: |
          mkdir -p data/import backups recovery
          sudo chown -R 10001:10001 data/import backups recovery
      - name: Build pinned application and operations images
        run: docker compose --profile ops build
      - name: Prepare the pinned database image for offline delivery
        run: |
          set -euo pipefail
          database_image=$(docker compose -f compose.yaml config --format json | python3 -c 'import json, sys; print(json.load(sys.stdin)["services"]["database"]["image"])')
          docker pull "$database_image"
          docker image tag "$database_image" "xiaoyi-catalog-database:$XIAOYI_RELEASE"
      - name: Validate full deployment and separate queues
        run: |
          docker compose config --quiet
          docker compose up -d --no-build --pull never --wait --wait-timeout 180
          curl --fail http://127.0.0.1:8080/api/ready
          docker compose exec -T api python -m xiaoyi_catalog.operations worker-health --queue interactive
          docker compose exec -T api python -m xiaoyi_catalog.operations worker-health --queue io
          docker compose exec -T api python -m xiaoyi_catalog.operations worker-health --queue cpu
      - name: Real PG16 backup, restore and checkpoint resume
        run: |
          docker compose run --rm ops pg_dump --version
          docker compose run --rm ops pg_restore --version
          docker compose run --rm ops python -m xiaoyi_catalog.operations_drill --destination /recovery/ci-drill
      - name: Export the images that passed deployment and recovery
        run: |
          set -euo pipefail
          mkdir -p release
          printf '%s\n' "$XIAOYI_RELEASE" > release/release.txt
          git rev-parse HEAD > release/source-commit.txt
          images=("xiaoyi-catalog-api:$XIAOYI_RELEASE" "xiaoyi-catalog-web:$XIAOYI_RELEASE" "xiaoyi-catalog-ops:$XIAOYI_RELEASE" "xiaoyi-catalog-database:$XIAOYI_RELEASE")
          docker image inspect --format '{"id":"{{.Id}}","tags":{{json .RepoTags}},"repo_digests":{{json .RepoDigests}},"os":"{{.Os}}","architecture":"{{.Architecture}}"}' "${images[@]}" > release/image-metadata.jsonl
          docker image save "${images[@]}" | gzip > release/release-images.tar.gz
          cp compose.yaml release/compose.yaml
          cp deploy/compose.offline.yaml release/compose.offline.yaml
          # Whitelist version-controlled templates and runbooks; never copy real .env.
          cp .env.example release/.env.example
          git ls-files -z -- deploy/ | while IFS= read -r -d '' path; do
            test -f "$path" && test ! -L "$path"
            mkdir -p "release/$(dirname "$path")"
            cp "$path" "release/$path"
          done
          mkdir -p release/docs
          cp docs/deployment.md docs/history-migration.md docs/backup-recovery.md release/docs/
          (cd release && find . -type f ! -path ./SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: release-images
          path: release/
          include-hidden-files: true
          compression-level: 0
          retention-days: 14
          if-no-files-found: error
      - name: Capture deployment logs
        if: always()
        run: |
          mkdir -p output
          docker compose logs --no-color > output/compose.log
          sudo cp recovery/ci-drill/drill-report.json output/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deployment-recovery-verification
          path: output/
          retention-days: 7
      - name: Remove disposable CI containers and volumes
        if: always()
        run: docker compose --profile ops down --volumes --remove-orphans
